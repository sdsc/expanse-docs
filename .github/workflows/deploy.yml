name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # Publishes the production build to the root of the gh-pages branch,
      # which is the source of the GitHub Pages site.
      # - rsync --delete without --delete-excluded never touches pr-preview/
      #   (the PR preview directories live there)
      # - deploy.yml on main and the PR preview jobs push to the same branch:
      #   on a rejected push, rebase on the fresh remote state and retry
      - name: Deploy to GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          rsync -a --delete --exclude='pr-preview' build/ "$RUNNER_TEMP/pages/"
          cd "$RUNNER_TEMP/pages"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            git fetch --force origin gh-pages
            git rebase origin/gh-pages
          done
          echo "::error::Failed to push to gh-pages after 3 attempts"
          exit 1
