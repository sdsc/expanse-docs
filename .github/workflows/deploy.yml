name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # workflow_dispatch can be triggered on any branch from the Actions UI;
    # only main may ever be published to the production site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # Publishes the production build to the root of the gh-pages branch,
      # which is the source of the GitHub Pages site.
      # - rsync --delete without --delete-excluded never touches pr-preview/
      #   (the PR preview directories live there)
      # - deploy.yml on main and the PR preview jobs push to the same branch:
      #   on a rejected push, rebase on the fresh remote state and retry
      - name: Deploy to GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages may not exist yet (fresh repository, or it was
          # recreated): tolerate the missing ref and start an orphan branch.
          git fetch --force origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          else
            git worktree add --detach "$RUNNER_TEMP/pages"
            git -C "$RUNNER_TEMP/pages" checkout --orphan gh-pages
            git -C "$RUNNER_TEMP/pages" rm -rf --quiet . || true
          fi
          # --delete prunes files from the previous deploy, but never the
          # worktree's .git, the PR preview directories, or the Pages-managed
          # special files (CNAME for a custom domain, .nojekyll).
          rsync -a --delete --exclude='.git' --exclude='pr-preview' \
            --exclude='CNAME' --exclude='.nojekyll' \
            build/ "$RUNNER_TEMP/pages/"
          cd "$RUNNER_TEMP/pages"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            git fetch --force origin gh-pages
            if ! git rebase origin/gh-pages; then
              git rebase --abort || true
              echo "::error::Rebase conflict while updating gh-pages"
              exit 1
            fi
          done
          echo "::error::Failed to push to gh-pages after 3 attempts"
          exit 1
