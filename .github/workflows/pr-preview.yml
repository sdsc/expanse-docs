name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # Build the PR with the preview base URL so that assets and internal
      # links resolve under /expanse-docs/pr-preview/pr-<number>/
      - name: Build website
        if: github.event.action != 'closed'
        run: npm run build
        env:
          BASE_URL: /expanse-docs/pr-preview/pr-${{ github.event.number }}/

      # Local composite action (.github/actions/pr-preview): deploys the
      # preview on opened/reopened/synchronize and removes it on close
      # (merged or not), keeping one sticky comment with the preview URL
      # once the GitHub Pages deployment is live.
      - name: Deploy preview
        if: github.event.action != 'closed'
        uses: ./.github/actions/pr-preview
        with:
          action: deploy
          pages-base-url: https://sdsc.github.io/expanse-docs

      - name: Remove preview
        if: github.event.action == 'closed'
        uses: ./.github/actions/pr-preview
        with:
          action: remove
