name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
  # merge_group keeps the check reporting if a merge queue is ever enabled.
  merge_group:

permissions:
  contents: read

# Same shape as build.yml and broken-links.yml: a new push to the same ref
# cancels the superseded run instead of stacking ~4 minute Lighthouse runs.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare site under baseUrl path for Lighthouse
        run: |
          mkdir -p lighthouse-site
          cp -r build lighthouse-site/expanse-docs

      # Lighthouse CI runs from the pinned @lhci/cli devDependency instead
      # of a third-party action wrapper. The runner's preinstalled Chrome
      # is used via CHROME_PATH.
      - name: Run Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --no-install lhci autorun --config=./lighthouserc.json

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
