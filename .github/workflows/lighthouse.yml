name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare site under baseUrl path for Lighthouse
        run: |
          mkdir -p lighthouse-site
          cp -r build lighthouse-site/expanse-docs

      # Lighthouse CI runs from the pinned @lhci/cli devDependency instead
      # of a third-party action wrapper. The runner's preinstalled Chrome
      # is used via CHROME_PATH.
      - name: Run Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --no-install lhci autorun --config=./lighthouserc.json

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
