name: Broken Links

on:
  # Runs on every PR: also a required status check for branch protection,
  # so it must always report (a path-filtered required check never
  # reports on non-matching PRs and blocks merge).
  pull_request:
  # merge_group keeps the required check reporting if a merge queue is
  # ever enabled on this repository.
  merge_group:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/broken-links.yml"
  schedule:
    # Weekly on Mondays, 16:00 UTC year-round: 08:00 PST in winter,
    # 09:00 PDT in summer.
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Key the group by event name as well: the weekly scheduled run shares
# refs/heads/main with push-triggered runs, and the two should not cancel
# each other.
concurrency:
  group: broken-links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # lychee is downloaded from its GitHub release, pinned by version and
      # checksum, instead of running it through a third-party action wrapper.
      - name: Install lychee (pinned release)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 2 -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz" | sha256sum --check --strict -
          mkdir -p .lychee-bin
          tar -xzf lychee.tar.gz -C .lychee-bin --strip-components=1
          .lychee-bin/lychee --version

      # Checks every hyperlink in docs/ and README.md with lychee.
      # Internal doc links are already enforced at build time
      # (onBrokenLinks: "throw" in docusaurus.config.js); this workflow
      # guards against external link rot, both on changes and weekly.
      #
      # Excludes (verified against the current content, see PR):
      # - portal.expanse.sdsc.edu: the portal serves a mismatched TLS
      #   intermediate chain (leaf issued by "InCommon RSA OV SSL CA 3"
      #   but the presented intermediate is "InCommon RSA Server CA 2"),
      #   so non-browser clients reject the certificate. Browsers accept
      #   it via AIA fetching. Re-check once the portal chain is fixed.
      # - dl.acm.org, doi.org/10.1145, software.intel.com: all return
      #   403 to every server-side client (bot walls, confirmed with a
      #   browser user agent); these links cannot be verified
      #   programmatically and work in browsers.
      # - mailto: not checked (lychee default).
      - name: Check links
        run: |
          .lychee-bin/lychee \
            --no-progress \
            --max-retries 2 \
            --exclude 'portal\.expanse\.sdsc\.edu' \
            --exclude '^https://(dl\.acm\.org|doi\.org/10\.1145)/' \
            --exclude '^https://software\.intel\.com/' \
            './docs/**/*.md' \
            README.md
